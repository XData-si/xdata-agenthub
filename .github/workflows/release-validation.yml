name: Release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cli/**'
      - 'tests/**'
      - 'registry/**'
      - 'skills/**'
      - 'scripts/**'
      - 'instructions/**'
      - 'agents/**'
      - 'workflows/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/release-validation.yml'

permissions:
  contents: read

jobs:
  cross-platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q cli tests
      - name: Unit and package tests
        run: python -m unittest discover -s tests -v
      - name: License, provenance and metadata gate
        run: python scripts/validate_release.py
      - name: Catalog and CLI doctor
        run: python cli/xah.py doctor
      - name: Heuristic repository audit
        run: python cli/xah.py audit --target .
      - name: Catalog smoke test
        run: python cli/xah.py list

  linux-installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install into disposable home
        shell: bash
        run: |
          export XAH_HOME="$RUNNER_TEMP/xah-home"
          export XAH_BIN="$RUNNER_TEMP/xah-bin"
          bash scripts/install.sh
          "$XAH_BIN/xah" doctor
          bash scripts/install.sh
          "$XAH_BIN/xah" doctor

  report:
    if: always()
    needs: [cross-platform, linux-installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize validation status
        env:
          CROSS_PLATFORM: ${{ needs.cross-platform.result }}
          INSTALLER: ${{ needs.linux-installer.result }}
        run: |
          echo "## Release validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cross-platform: $CROSS_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          echo "- Linux installer: $INSTALLER" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native Claude/Codex/OpenCode runtime: NOT TESTED by this workflow" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CROSS_PLATFORM" != success ] || [ "$INSTALLER" != success ]; then exit 1; fi

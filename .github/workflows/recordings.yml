name: Recordings
# Manual, and on pull requests that change a tape: renders the terminal recordings in demos/recordings/*.tape with VHS and uploads them as an artifact
# (MP4 and GIF). Recordings run real commands against the public repository and release; compare.tape replays the
# published demo answers. Nothing is committed or published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'demos/recordings/**'
      - '.github/workflows/recordings.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install fonts and VHS
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          install-fonts: true
      - name: Render tapes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p demos/recordings/out
          for tape in install verify-release compare mcp short; do
            vhs "demos/recordings/$tape.tape"
          done
          ls -l demos/recordings/out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recordings
          path: demos/recordings/out/
          retention-days: 30

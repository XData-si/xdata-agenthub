name: Dependency review
# Fails a pull request that adds a dependency (including a GitHub Action) with a known vulnerability of moderate
# severity or higher. Uses the repository dependency graph; nothing is installed.
on:
  pull_request:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate

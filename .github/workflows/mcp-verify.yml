name: MCP verify
# Verified MCP L1/L2 (docs/VERIFIED_MCP.md): for each packaged catalog entry, checks identity, pins the artifact,
# reads tools/list from the server in a container without network or credentials, and runs syft, osv-scanner and
# gitleaks. Evidence is uploaded as an artifact only; nothing is written to the repository. A maintainer reviews it
# and raises levels in a pull request.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Catalog ids separated by spaces (empty = every entry with a package)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/mcp_l2_scan.py'
      - 'scripts/mcp_tools_list.py'
      - 'scripts/verify_mcp_identity.py'
      - 'cli/mcp_tool_scan.py'
      - 'cli/mcp_evidence.py'
      - '.github/workflows/mcp-verify.yml'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          IDS: ${{ inputs.ids }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, re
          servers = json.load(open("registry/mcp-servers.json"))["servers"]
          packaged = [s["id"] for s in servers if any(a["kind"] == "package" for a in s["artifacts"])]
          wanted = (os.environ.get("IDS") or "").split()
          if any(not re.fullmatch(r"[a-z0-9-]+", i) or i not in {s["id"] for s in servers} for i in wanted):
              raise SystemExit(f"unknown id in {wanted}")
          print("ids=" + json.dumps(wanted or packaged))
          EOF

  verify:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned scanners
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          fetch() { curl -fsSL --retry 3 -o "$2" "$1"; echo "$3  $2" | sha256sum -c -; }
          fetch https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz syft.tgz \
            bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          fetch https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 osv-scanner \
            160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz gitleaks.tgz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          mkdir -p bin
          tar -xzf syft.tgz -C bin syft
          tar -xzf gitleaks.tgz -C bin gitleaks
          install -m 0755 osv-scanner bin/osv-scanner
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ID: ${{ matrix.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/mcp_l2_scan.py "$ID" --out "$RUNNER_TEMP/evidence" --run-url "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-evidence-${{ matrix.id }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: warn

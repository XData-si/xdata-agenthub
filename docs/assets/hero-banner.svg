<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="XData AgentHub — agent skills you can trust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b18"/><stop offset=".6" stop-color="#0b1120"/><stop offset="1" stop-color="#1b1446"/></linearGradient>
    <radialGradient id="g1" cx="85%" cy="10%" r="60%"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0%" cy="100%" r="60%"><stop offset="0" stop-color="#2563eb" stop-opacity=".45"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#g1)"/>
  <rect width="1280" height="420" fill="url(#g2)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="80" y="70" width="290" height="30" rx="15" fill="#facc15" fill-opacity=".08" stroke="#facc15" stroke-opacity=".55"/>
    <text x="225" y="90" font-size="15" fill="#fde68a" text-anchor="middle">Made in the EU · Open source · MIT</text>
    <text x="80" y="170" font-size="64" font-weight="700" fill="#f8fafc">XData AgentHub</text>
    <text x="80" y="230" font-size="40" font-weight="700" fill="url(#txt)">Agent skills you can trust</text>
    <text x="80" y="278" font-size="21" fill="#cbd5e1">Curated skills for Claude Code, Codex and OpenCode —</text>
    <text x="80" y="306" font-size="21" fill="#cbd5e1">every one security-reviewed, sealed and signed.</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="80" y="336" width="128" height="30" rx="8" fill="#0f172a" stroke="#334155"/><text x="144" y="356" text-anchor="middle">Security gate</text>
      <text x="216" y="356" fill="#64748b">→</text>
      <rect x="232" y="336" width="104" height="30" rx="8" fill="#0f172a" stroke="#334155"/><text x="284" y="356" text-anchor="middle">AI review</text>
      <text x="344" y="356" fill="#64748b">→</text>
      <rect x="360" y="336" width="124" height="30" rx="8" fill="#0f172a" stroke="#334155"/><text x="422" y="356" text-anchor="middle">Maintainer</text>
      <text x="492" y="356" fill="#64748b">→</text>
      <rect x="508" y="336" width="76" height="30" rx="8" fill="#0f172a" stroke="#334155"/><text x="546" y="356" text-anchor="middle">Seal</text>
      <text x="592" y="356" fill="#64748b">→</text>
      <rect x="608" y="336" width="128" height="30" rx="8" fill="#0f172a" stroke="#334155"/><text x="672" y="356" text-anchor="middle">Signed release</text>
    </g>
  </g>
  <g transform="translate(860 30)">
    <circle cx="180" cy="180" r="150" fill="#7c3aed" fill-opacity=".18"/>
    <circle cx="180" cy="180" r="128" fill="none" stroke="#94a3b8" stroke-opacity=".3" stroke-dasharray="2 8"/>
    <g stroke="#93c5fd" stroke-width="1.6" stroke-dasharray="4 6" opacity=".85">
      <line x1="180" y1="180" x2="180" y2="52"/><line x1="180" y1="180" x2="302" y2="140"/><line x1="180" y1="180" x2="255" y2="284"/><line x1="180" y1="180" x2="105" y2="284"/><line x1="180" y1="180" x2="58" y2="140"/>
    </g>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#e2e8f0">
      <circle cx="180" cy="52" r="28" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/><text x="180" y="56">AI</text>
      <circle cx="302" cy="140" r="28" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/><text x="302" y="144">Security</text>
      <circle cx="255" cy="284" r="28" fill="#0f172a" stroke="#f0abfc" stroke-width="2"/><text x="255" y="288">DevOps</text>
      <circle cx="105" cy="284" r="28" fill="#0f172a" stroke="#facc15" stroke-width="2"/><text x="105" y="288">EU</text>
      <circle cx="58" cy="140" r="28" fill="#0f172a" stroke="#34d399" stroke-width="2"/><text x="58" y="137">Engi-</text><text x="58" y="150">neering</text>
    </g>
    <circle cx="180" cy="180" r="48" fill="url(#core)"/>
    <path d="M162 181l12 12 25-27" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
